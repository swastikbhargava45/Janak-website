<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Janak Cafe: Authentic South Indian and Italian fusion in Madgaon, Goa. Experience premium taste and ambiance.">
    <link rel="icon" type="image/jpg" href="https://i.postimg.cc/pmWJCzq6/logo.jpg">
    <title>The Janak Cafe | South Indian & Italian Goa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background-color:#0a0a0a;color:#f5f5f5}h1,h2,h3,h4,h5,.font-serif{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans overflow-x-hidden w-full antialiased pt-28 md:pt-24">
    <nav class="fixed top-0 left-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-neutral-800 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-serif text-[#C69C53] tracking-widest uppercase" data-config="restaurantName">Logo</a>
            <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden text-[#C69C53] focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-wider font-semibold text-neutral-300 items-center">
                <a href="index.html" class="text-[#C69C53]">Home</a><a href="menu.html" class="hover:text-[#C69C53]">Menu</a><a href="about.html" class="hover:text-[#C69C53]">About</a><a href="contact.html" class="hover:text-[#C69C53]">Contact</a><a href="reservation.html" class="bg-[#C69C53] text-black px-6 py-2 rounded font-semibold hover:bg-white transition-all">Book Table</a>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-[#0a0a0a] border-b border-neutral-800 pb-4 text-center flex flex-col space-y-4 pt-4 uppercase tracking-wider font-semibold text-neutral-300">
            <a href="index.html" class="text-[#C69C53]">Home</a><a href="menu.html">Menu</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="reservation.html">Book Table</a>
        </div>
    </nav>

    <header class="relative h-[80vh] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-black/60 z-10"></div>
        <div class="absolute inset-0 bg-cover bg-center" data-img="hero"></div>
        <div class="relative z-20 text-center px-6 max-w-4xl mx-auto">
            <h1 class="text-5xl md:text-7xl font-serif text-white mb-6 tracking-wide" data-config="restaurantName">The Janak Cafe</h1>
            <p class="text-xl md:text-2xl text-neutral-300 mb-10 font-light" data-config="tagline"></p>
            <a href="menu.html" class="inline-block border border-[#C69C53] text-[#C69C53] px-10 py-3 rounded-full font-bold uppercase tracking-widest hover:bg-[#C69C53] hover:text-black transition-all">Explore Menu</a>
        </div>
    </header>

    <script src="js/config.js"></script><script src="js/main.js"></script>
</body>
</html>
